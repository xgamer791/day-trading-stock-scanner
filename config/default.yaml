scan:
  name: default-day-trade
  universe: us_common_stock
  session: premarket  # premarket | open | midday

filters:
  min_price: 2.0
  max_price: 50.0
  min_rel_volume: 2.0
  min_gap_pct: 3.0
  min_avg_volume: 500000
  max_float_millions: 100

ranking:
  # Weighted score components (must sum ~1.0)
  gap_weight: 0.35
  rel_volume_weight: 0.40
  dollar_volume_weight: 0.25
  top_n: 25

output:
  format: table  # table | json | csv
  path: data/last_scan.csv
