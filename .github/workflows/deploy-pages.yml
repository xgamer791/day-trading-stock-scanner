name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Snapshot refresh only (live feed is browser-polled, not live.json).
    - cron: "0 * * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

# cancel-in-progress:false — minute cron + cancel was leaving deploy-pages
# stuck in deployment_queued until timeout (gear removal never reached live).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch live Yahoo market data
        run: npm run fetch:live
        continue-on-error: true
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          NEXT_PUBLIC_QUOTE_PROXY_URL: ${{ secrets.QUOTE_PROXY_URL }}
      - name: Ensure .nojekyll
        run: touch out/.nojekyll
      # deploy-pages was stuck in deployment_queued (10m timeouts).
      # Publish the static export straight to the gh-pages branch instead.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false
