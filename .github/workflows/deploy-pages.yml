name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Snapshot refresh only (live feed is browser-polled, not live.json).
    - cron: "0 * * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch live Yahoo market data
        run: npm run fetch:live
        continue-on-error: true
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          NEXT_PUBLIC_QUOTE_PROXY_URL: ${{ secrets.QUOTE_PROXY_URL }}
      - name: Ensure .nojekyll
        run: touch out/.nojekyll
      # Mirror to gh-pages branch (backup / branch source).
      - name: Mirror to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Repo Pages build_type is "workflow" — this is what xgamer791.github.io serves.
      - id: deployment
        uses: actions/deploy-pages@v4
