name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresh published snapshot every minute during US market hours (ET)
    - cron: "*/1 8-21 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress:false — minute cron + cancel was leaving deploy-pages
# stuck in deployment_queued until timeout (gear removal never reached live).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch live Yahoo market data
        run: npm run fetch:live
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          NEXT_PUBLIC_QUOTE_PROXY_URL: ${{ secrets.QUOTE_PROXY_URL }}
      - name: Ensure .nojekyll
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
